services:

  api:
    build: .
    container_name: payflow-api
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:YOUR_PASSWORD@host.docker.internal:5432/PayFlowDB
      REDIS_HOST: redis
      REDIS_PORT: 6379
    depends_on:
      - redis

  redis:
    image: redis:latest
    container_name: payflow-redis
    ports:
      - "6379:6379"

  celery-worker:
    build: .
    container_name: payflow-celery-worker
    command: celery -A app.celery_app.celery_app worker --loglevel=info --pool=solo
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:Guggu@host.docker.internal:5432/PayFlowDB
      REDIS_HOST: redis
      REDIS_PORT: 6379
    depends_on:
      - redis